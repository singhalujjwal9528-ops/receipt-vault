version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: receipt_manager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: receipt_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: receipt_user
      POSTGRES_PASSWORD: receipt_secure_password
      POSTGRES_DB: receipt_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt_user -d receipt_manager"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
